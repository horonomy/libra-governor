[package]
name = "libra-governor-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Libra Governor: local daemon — Unix-socket server, bounded reconnaissance, and Completion Contract drafting."

[dependencies]
libra-governor-domain = { path = "../domain" }
libra-governor-estimator = { path = "../estimator" }
libra-governor-extension = { path = "../extension" }
libra-governor-gateway = { path = "../gateway" }
libra-governor-ledger = { path = "../ledger" }
libra-governor-protocol = { path = "../protocol" }
serde.workspace = true
serde_json.workspace = true
time.workspace = true
thiserror.workspace = true
sha2.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["server", "http1", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync"] }
