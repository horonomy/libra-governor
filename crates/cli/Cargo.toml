[package]
name = "libra-governor-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Libra Governor: libra-governor CLI binary — daemon runner, Claude Code hook, and statusline subcommands."
default-run = "libra-governor"

[[bin]]
name = "libra-governor"
path = "src/main.rs"

[dependencies]
libra-governor-daemon = { path = "../daemon" }
libra-governor-domain = { path = "../domain" }
libra-governor-estimator = { path = "../estimator" }
libra-governor-evidence-adapter = { path = "../evidence-adapter" }
libra-governor-extension = { path = "../extension" }
libra-governor-gateway = { path = "../gateway" }
libra-governor-ledger = { path = "../ledger" }
libra-governor-protocol = { path = "../protocol" }
libra-governor-quota-observation = { path = "../quota-observation" }
libra-governor-quota-source = { path = "../quota-source" }
rustix.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
uuid.workspace = true

[features]
# The only manifest line allowed to enable the daemon's feature
# (ADR-0019 §1, workspace feature unification).
trusted-principal = ["libra-governor-daemon/trusted-principal"]

[dev-dependencies]
tempfile.workspace = true
# Test-only (HORO-2219): makes a ledger's schema look behind, to prove the
# read-only paths refuse instead of migrating.
rusqlite.workspace = true
# Test-only (HORO-1768 PR-C): cross-checks the real launch gate's observed
# admission/occupancy against `pacing-gate`'s independent simulation
# harness in `tests/launch_live_occupancy_consistency.rs`. Never used from
# `src/` — see that test file's own module docs.
libra-governor-pacing-gate = { path = "../pacing-gate" }
