[package]
name = "libra-governor-extension"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Libra Governor: local extension points (Business Context Provider, Outcome Provider, policy webhook, event delivery) — outbound-only over loopback HTTP, HMAC-signed."

[dependencies]
libra-governor-domain = { path = "../domain" }
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "client"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "macros"] }
serde.workspace = true
serde_json.workspace = true
time.workspace = true
thiserror.workspace = true
uuid.workspace = true
sha2.workspace = true
hmac = "0.12"

[dev-dependencies]
tempfile.workspace = true
hyper = { version = "1", features = ["http1", "client", "server"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "server", "http1", "http2", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync"] }
