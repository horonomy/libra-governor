[project]
name = "phase0"
version = "0.1.0"
description = "Phase 0 estimator feasibility replay harness (HORO-1120)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "datasets>=2.18",
]

[project.scripts]
phase0 = "phase0.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phase0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[dependency-groups]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
]
