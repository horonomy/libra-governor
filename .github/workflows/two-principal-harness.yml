name: Two-principal harness

# Deliberately minimal (ADR-0019 §5 "Orchestration and teardown": "It
# just calls run.sh") — this is new CI surface, and this repository's
# policy requires changes to CI definitions to get explicit review
# before merge, so this workflow does nothing beyond what
# `harness/two-principal/run.sh` itself already does locally.
#
# `workflow_dispatch` plus a path filter, not `push`/`pull_request` on
# every change — the harness only needs to re-run when something it
# actually exercises changes.
on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "crates/daemon/**"
      - "crates/cli/**"
      - "crates/ledger/**"
      # ADR-0019 §5 names daemon/cli/ledger/harness explicitly; these two
      # extra entries are a small, deliberate addition so an edit to the
      # harness's own test fixtures or to this workflow file also
      # triggers it, rather than only ever running via manual dispatch.
      - "crates/two-principal-harness/**"
      - "harness/**"
      - ".github/workflows/two-principal-harness.yml"

permissions:
  contents: read

jobs:
  two-principal-harness:
    name: two-principal harness (disposable container)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: run the disposable two-principal harness
        run: harness/two-principal/run.sh

  # ADR-0019 §6 PR-2 / PR-2's design doc §6: proves the feature-enabled
  # binary builds, lints clean, and passes its own unit/integration
  # suite — on Linux AND macOS — while also being the mechanical proof
  # that compiling `trusted-principal` in changes nothing about
  # default-mode behavior (no pinned config exists on either runner).
  # The macOS leg is compile plus unit/integration tests only: it does
  # NOT run the container harness above (ADR-0019 R8's Phase 2 macOS
  # harness work remains separate future work, and nothing here runs on
  # a developer's own Mac).
  trusted-principal-build:
    name: trusted-principal feature build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch @ 2026-09-18
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy -p libra-governor-cli -p libra-governor-daemon --features trusted-principal --all-targets -- -D warnings
      - run: cargo test -p libra-governor-cli -p libra-governor-daemon --features trusted-principal
