name: Release

# Three triggers, deliberately kept separate:
#
# - pull_request: build-only validation of this workflow itself. Uploads a
#   *workflow artifact* (private to repo collaborators, auto-expires) via
#   actions/upload-artifact — never a public GitHub Release. This is how the
#   workflow definition gets tested before it is trusted to run on a tag.
# - workflow_dispatch: same build-only path, runnable on-demand against any
#   ref once this file is merged to main. Used to produce a verifiable
#   artifact from an exact merge-commit SHA for local/offline verification
#   (e.g. an isolated preview install test) without creating a tag.
# - push tags v*: the only trigger that creates a public GitHub Release.
#
# HORO-1857 decision packet (Jira comment 27544): this workflow may be
# implemented and tested, but pushing a `v*` tag and therefore exercising
# the release-creation path is NOT authorized by that packet. The
# create-release job below is gated on the tag trigger by construction —
# it does not run from pull_request or workflow_dispatch.
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      # Every crate libra-governor-cli transitively depends on (verified via
      # `cargo tree -p libra-governor-cli -e normal`), so a PR touching any
      # of them actually triggers this build-only validation.
      - "crates/cli/**"
      - "crates/daemon/**"
      - "crates/domain/**"
      - "crates/protocol/**"
      - "crates/ledger/**"
      - "crates/estimator/**"
      - "crates/evidence-adapter/**"
      - "crates/extension/**"
      - "crates/gateway/**"
      - "crates/quota-observation/**"
      - "crates/quota-source/**"
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  # The one binary this workflow ships. lg-fake-server/lg-raw-client (in
  # crates/two-principal-harness) are test-only fixtures, never released.
  RELEASE_BIN: libra-governor

# Least privilege by default; the release job elevates only what it needs.
permissions:
  contents: read

jobs:
  # Builds and smoke-tests the release binary on every target this workflow
  # claims to support. Runs on pull_request, workflow_dispatch, and tag push
  # alike — the tag-push run reuses this job's artifacts rather than
  # rebuilding, so the exact bytes that were validated are the exact bytes
  # released.
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            runnable: true
          # v0.0.4 Cooperative Preview supports Apple Silicon macOS only
          # (ADR-0025 item 7, founder artifact-matrix decision). The
          # x86_64-apple-darwin and x86_64-unknown-linux-gnu targets are
          # deliberately not built here: this workflow publishes every leg
          # as a release asset with no per-asset "unsupported" label, so an
          # unverified target would read as officially supported. Restore a
          # leg only together with its install evidence and support claim.
    runs-on: ${{ matrix.os }}
    # No id-token/attestations:write here deliberately: this job runs
    # `cargo build` over third-party dependency source (build.rs/proc-macro
    # code executes during compilation). Granting attestation-signing
    # permission to a job that compiles untrusted code is a known
    # privilege-escalation vector — a malicious build script could misuse
    # the OIDC token to forge an attestation for arbitrary content, not
    # just this binary. Attestation happens in the separate `attest` job
    # below, which never builds anything.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On pull_request this checks out the ephemeral merge commit by
          # default. Pin explicitly to the PR head SHA so the provenance
          # record below names a real, citable commit instead of a
          # synthetic merge ref that doesn't exist on any branch.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # HORO-2162: a pushed `v*` tag must name the version this checkout
      # builds, or the published artifacts would carry a different
      # `--version` than the release that announces them. Runs before any
      # compilation so a mistagged push fails fast and publishes nothing.
      - name: tag matches workspace version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          # Via env, never interpolated into the script text: a tag name is
          # attacker-influenced input.
          TAG: ${{ github.ref_name }}
        run: scripts/check-release-tag.sh "$TAG"

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, pinned (reused from ci.yml)
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-${{ matrix.target }}

      - name: build release binary
        run: cargo build --release --locked --package libra-governor-cli --bin ${{ env.RELEASE_BIN }} --target ${{ matrix.target }}

      - name: smoke-test the binary (native targets only)
        if: matrix.runnable
        run: ./target/${{ matrix.target }}/release/${{ env.RELEASE_BIN }} --version

      - name: assemble artifact
        shell: bash
        run: |
          set -euo pipefail
          stage="dist/${{ env.RELEASE_BIN }}-${{ matrix.target }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/${{ env.RELEASE_BIN }}" "$stage/"
          chmod +x "$stage/${{ env.RELEASE_BIN }}"

          resolved_sha="${{ github.event.pull_request.head.sha || github.sha }}"
          {
            echo "binary: ${{ env.RELEASE_BIN }}"
            echo "target: ${{ matrix.target }}"
            echo "source_sha: $resolved_sha"
            echo "run_executed_version_check: ${{ matrix.runnable }}"
            echo "runner_image: ${{ matrix.os }}"
            echo "rustc: $(rustc -Vv | tr '\n' ';')"
            echo "cargo: $(cargo -V)"
            echo "built_at_utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$stage/PROVENANCE.txt"

          # tar before upload-artifact: upload-artifact zips its input and
          # does not preserve the executable bit, so an unpacked download
          # would need a chmod the real distribution path won't have.
          tar -czf "dist/${{ env.RELEASE_BIN }}-${{ matrix.target }}.tar.gz" -C dist "${{ env.RELEASE_BIN }}-${{ matrix.target }}"
          # cd into dist first: shasum records whatever path it's given
          # inside the .sha256 file, and a consumer who downloads both
          # release assets into one directory and runs `shasum -c` expects
          # a bare filename there, not a dist/-prefixed path that won't
          # resolve relative to their own cwd.
          (cd dist && shasum -a 256 "${{ env.RELEASE_BIN }}-${{ matrix.target }}.tar.gz" > "${{ env.RELEASE_BIN }}-${{ matrix.target }}.tar.gz.sha256")

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.RELEASE_BIN }}-${{ matrix.target }}
          path: |
            dist/${{ env.RELEASE_BIN }}-${{ matrix.target }}.tar.gz
            dist/${{ env.RELEASE_BIN }}-${{ matrix.target }}.tar.gz.sha256
          retention-days: 14
          if-no-files-found: error

  # Deliberately a separate job from `build`, not a step inside it: this
  # job never runs `cargo build` or any other third-party code, so it is
  # safe to grant it id-token/attestations:write — there is nothing here
  # that untrusted dependency code could run to misuse that permission.
  # It only downloads the already-built tarball and signs its digest.
  # Fork-PR/Dependabot runs never reach id-token/attestations:write at
  # all (those tokens don't carry it), so this job's attestation step
  # fails closed there without blocking the rest of that PR's CI.
  attest:
    name: attest provenance (${{ matrix.target }})
    needs: build
    # Skipped on pull_request: attestation writes a permanent, public
    # Sigstore Rekor transparency-log entry. That's an irreversible public
    # side effect that shouldn't happen on every routine PR build of a
    # not-yet-authorized release artifact. workflow_dispatch and the real
    # tag-push path still run it, which is enough to validate the mechanism
    # and to attest anything that actually becomes a release.
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ env.RELEASE_BIN }}-${{ matrix.target }}
          path: dist
      - uses: actions/attest-build-provenance@bd77c077858b8d561b7a36cbe48ef4cc642ca39d # v2.2.2
        with:
          subject-path: "dist/${{ env.RELEASE_BIN }}-${{ matrix.target }}.tar.gz"

  # Only reachable on an actual `v*` tag push. Not authorized to run yet
  # per HORO-1857 comment 27544 — implemented so the file is complete and
  # reviewable, never exercised without a separately authorized tag push.
  #
  # The event_name check matters as much as the ref check: workflow_dispatch
  # can be run against any existing ref, including a pre-existing `v*` tag
  # (this repo already has v0.0.1/v0.0.2) — a dispatch against such a tag
  # would set github.ref to refs/tags/v0.0.1 and satisfy a ref-only check,
  # publishing a release without a real tag push ever happening. Requiring
  # github.event_name == 'push' closes that.
  create-release:
    name: publish GitHub Release
    needs: [build, attest]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: read
    steps:
      # The approved release-notes body lives in the tagged tree and is the
      # body of the first publicly visible Release. The checkout pins the
      # tag's own commit, so the notes cannot differ from the code released.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # softprops/action-gh-release only warns and falls back to an empty
      # body when body_path cannot be read, which would publish a Release
      # with no notes. Fail before anything is created instead.
      - name: require the approved release-notes body
        env:
          NOTES: docs/release-notes/${{ github.ref_name }}.md
        run: |
          set -euo pipefail
          test -s "$NOTES" || { echo "::error::missing or empty $NOTES"; exit 1; }
          test "$(wc -c < "$NOTES")" -lt 100000 || { echo "::error::$NOTES too large"; exit 1; }
          # One marker per mandatory disclosure (ADR-0026 items 1-5, fail-open,
          # known pricing errors, same-user trust boundary).
          for marker in \
            'not a hard spending cap' \
            'Admission-bounded (cooperative)' \
            'In-turn overshoot' \
            'Codex is not gated' \
            'never your provider bill' \
            'Accounting boundary' \
            'Fail-open behaviour' \
            'over-accounted by approximately 5x' \
            'NOT a security boundary'; do
            grep -qF -- "$marker" "$NOTES" || { echo "::error::$NOTES lacks the required disclosure: $marker"; exit 1; }
          done

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      # Re-verify each tarball's attestation against this exact repo before
      # ever publishing it. The attest step above ran right after the build
      # (currently aarch64-apple-darwin only); this is the one place every
      # attested tarball is checked together, immediately before the artifacts
      # become public, so a provenance gap can never reach a GitHub Release
      # unnoticed.
      - name: verify provenance before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for f in dist/*.tar.gz; do
            gh attestation verify "$f" --repo "${{ github.repository }}"
          done

      - uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          body_path: docs/release-notes/${{ github.ref_name }}.md
          generate_release_notes: false
