name: CodeQL

# Advanced setup rather than GitHub's default setup because default setup
# cannot cover Rust: PATCH /code-scanning/default-setup rejects `rust`
# ("must be one of: actions, c-cpp, csharp, go, java-kotlin,
# javascript-typescript, python, ruby, swift"), which would leave the entire
# Rust workspace unscanned. Standard GitHub-hosted runners only; code
# scanning on public repositories is free, so this adds no cost.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, matching the cadence GitHub's default setup uses.
    - cron: "27 4 * * 1"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # `none` build mode for all three: Rust and Python are extracted
        # without a build, and `actions` scans the workflow files themselves.
        language: [actions, python, rust]
    steps:
      # Pinned to commit SHAs rather than the @v4 / @v7 major tags; see the note
      # in ci.yml. Dependabot keeps these current. github/codeql-action/init and
      # /analyze are two paths in one repository and must therefore stay on the
      # same SHA, or init and analyze can disagree about the bundle they use.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
