name: Phase 0 estimator harness CI

# The path filter is a deliberate cost control: this harness is only relevant to
# experiments/phase0. The workflow's own path is listed as well, because this
# workflow is the only check on its own correctness - without it, a YAML syntax
# error (which GitHub rejects at parse time as a 0-job, 0-second run), a broken
# install step, or a regression to the permissions block below all merge green.
# Deliberately not widened any further, so an unrelated change still does not
# start this job.
on:
  push:
    branches: [main]
    paths:
      - "experiments/phase0/**"
      - ".github/workflows/phase0-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "experiments/phase0/**"
      - ".github/workflows/phase0-ci.yml"

defaults:
  run:
    working-directory: experiments/phase0

# Least privilege: the single job below only checks out the repository and runs
# uv/ruff/pytest. Without this block it inherits the repository's default
# GITHUB_TOKEN permissions, which CodeQL flags as
# actions/missing-workflow-permissions.
permissions:
  contents: read

jobs:
  lint-and-test:
    name: ruff + pytest (fixture only, no network)
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHAs rather than the @v7 major tags; see the note in
      # ci.yml. Dependabot keeps these current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Sync dependencies
        run: uv sync --group dev

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      # Network-free by construction: tests only ever read
      # tests/fixtures/mini.parquet, never data/raw/ or the network. The
      # full fetch/extract/run pipeline against real S3/HuggingFace data is
      # a local/manual step (see README.md), not a CI gate.
      - name: pytest (fixture only)
        run: uv run pytest tests/ -x
