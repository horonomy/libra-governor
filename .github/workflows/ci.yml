name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# Least privilege for every job below: all three only check out the repository
# and run cargo. Without this block each job inherits the repository's default
# GITHUB_TOKEN permissions, which CodeQL flags as
# actions/missing-workflow-permissions.
permissions:
  contents: read

# Every third-party action below is pinned to a full commit SHA rather than a
# mutable tag or branch, so the code that runs in CI cannot change underneath us
# if an upstream tag is force-moved or an upstream branch advances. The trailing
# comment records the human-readable version each SHA corresponds to; Dependabot
# (github-actions ecosystem, see .github/dependabot.yml) updates both the SHA and
# the comment when a new release ships, so pinning does not freeze us.
#
# dtolnay/rust-toolchain is the notable one: `@stable` was a *branch*, not a tag,
# and the branch is what supplied the action's default `toolchain` input. With a
# SHA pin that signal is no longer in the ref, so `toolchain: stable` is now
# stated explicitly. Behaviour is unchanged - current stable is still installed
# at run time - but the intent is now in the file rather than in the ref.
jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch @ 2026-09-18
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch @ 2026-09-18
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  build-and-test:
    name: cargo build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # ADR-0014 (HORO-1380 S4c) requires the cross-process write-lock
        # tests to run on macOS, not just Linux — flock(2) has the same
        # open-file-description semantics on both, but shipping to macOS
        # on Linux-only CI evidence is explicitly called out as
        # unacceptable there. Mirrors Circinus's existing CI matrix.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch @ 2026-09-18
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace
      - name: fresh install and first preflight (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cleanup() {
            libra-governor daemon stop || true
          }
          trap cleanup EXIT
          ./scripts/install.sh
          libra-governor doctor --json
          preflight_output="$(printf '%s\n' '{"session_id":"ci-fresh-install","cwd":".","prompt":"fresh install preflight","hook_event_name":"UserPromptSubmit"}' | libra-governor hook user-prompt-submit)"
          printf '%s\n' "$preflight_output"
          PRELIGHT_OUTPUT="$preflight_output" python3 - <<'PY'
          import json, os
          value = json.loads(os.environ["PRELIGHT_OUTPUT"])
          context = value["hookSpecificOutput"]["additionalContext"]
          if "Preflight complete" not in context:
              raise SystemExit(f"fresh install preflight was unavailable: {context!r}")
          PY

  # Secret scanning is provided by GitHub's native secret scanning + push
  # protection (enabled at the repository level; see SECURITY.md), not by
  # a CI job. gitleaks/gitleaks-action requires a paid GITLEAKS_LICENSE for
  # organization-owned repositories (horonomy is an org), so it is
  # intentionally not wired in here to avoid a CI gate that fails for
  # licensing reasons unrelated to code quality.
