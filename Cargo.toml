[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/protocol",
    "crates/daemon",
    "crates/cli",
    "crates/ledger",
    "crates/estimator",
    "crates/gateway",
    "crates/extension",
    "crates/evidence-adapter",
]
exclude = ["experiments/phase0", "experiments/mvp1_validation/fixtures/rust-crate"]

[workspace.package]
version = "0.0.2"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/horonomy/libra-governor"

[workspace.dependencies]
uuid = { version = "1", features = ["v4", "v7", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
sha2 = "0.10"
