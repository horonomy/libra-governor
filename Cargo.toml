[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/protocol",
    "crates/daemon",
    "crates/cli",
    "crates/ledger",
    "crates/estimator",
]
exclude = ["experiments/phase0"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/horonomy/libra-governor"

[workspace.dependencies]
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
