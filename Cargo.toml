[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/protocol",
    "crates/daemon",
    "crates/cli",
    "crates/ledger",
    "crates/estimator",
    "crates/gateway",
    "crates/extension",
    "crates/evidence-adapter",
]
exclude = ["experiments/phase0", "experiments/mvp1_validation/fixtures/rust-crate"]

[workspace.package]
version = "0.0.2"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/horonomy/libra-governor"

[workspace.dependencies]
uuid = { version = "1", features = ["v4", "v7", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
thiserror = "2"
# `fallible_uint` re-enables `FromSql`/`ToSql` for `u64`/`usize`, which rusqlite
# 0.40 moved behind this opt-in feature. The gated impls are the same fallible
# `i64 -> u64` conversions 0.32 provided unconditionally, so this keeps the
# ledger's `COUNT(*)` reads (crates/ledger/src/query.rs) behaving identically.
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint"] }
tempfile = "3"
sha2 = "0.11"
